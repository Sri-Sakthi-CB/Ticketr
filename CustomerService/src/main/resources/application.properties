spring.application.name=CustomerService

# --- Database (PostgreSQL) ---
# Either set SPRING_DATASOURCE_URL directly to a full jdbc:postgresql://... string,
# or (e.g. on Render, via a Blueprint's `fromDatabase` fields) set PGHOST/PGPORT/PGDATABASE
# and it's composed automatically. Local defaults match docker-compose.yml.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ticketing}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticketing}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ticketing}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
# Demo-only secret. ALWAYS override with a real JWT_SECRET env var outside local dev.
app.jwt.secret=${JWT_SECRET:c8f1b2a4e6d9f3a7b5c1d8e2f4a6b9c3d7e1f5a8b2c6d9e3f7a1b4c8d6e2f9a3}
app.jwt.expiration-minutes=480

# --- CORS ---
# Comma-separated list of allowed frontend origins. Override via CORS_ALLOWED_ORIGINS in production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${PORT:8080}
